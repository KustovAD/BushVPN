# Сайт: https://bushvpns.duckdns.org
# VPN (sing-box) на :8443 — nginx этот порт не слушает.

server {
    listen 80;
    listen [::]:80;
    server_name bushvpns.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bushvpns.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/bushvpns.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bushvpns.duckdns.org/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
