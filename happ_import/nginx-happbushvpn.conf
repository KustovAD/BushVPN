# Только заглушка Happ. Не слушать 443 — там sing-box.
# Не делать return 301 https://$host — уйдёт на :443 (сайт или Reality).

server {
    listen 80;
    server_name happbushvpns.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://happbushvpns.duckdns.org:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name happbushvpns.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/happbushvpns.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/happbushvpns.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
